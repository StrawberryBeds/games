
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.sanity.io https://static.cloudflareinsights.com https://apis.google.com;
      script-src-elem 'self' https://cdn.jsdelivr.net https://cdn.sanity.io https://static.cloudflareinsights.com https://apis.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' https://ludico-9433b.firebaseio.com https://dx2ymrki.api.sanity.io https://identitytoolkit.googleapis.com https://firestore.googleapis.com;
      img-src 'self' data: blob: https://cdn.sanity.io https://www.google.com;
      base-uri 'self';
      form-action 'self';
      frame-src 'self' https://accounts.google.com;
      object-src 'none'
    """
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
